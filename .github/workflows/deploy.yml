name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily at 11:00 UTC: refresh YouTube channel stats and redeploy.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write # lets the build commit the daily channel-stats snapshot
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Production URL: canonical links, Open Graph, structured data.
      NEXT_PUBLIC_SITE_URL: https://cabin.smartercircuits.com
      # Contact form: Web3Forms is the default (src/data/contact.ts). Set these
      # repository variables only to switch provider (Settings → Secrets and
      # variables → Actions → Variables).
      NEXT_PUBLIC_CONTACT_PROVIDER: ${{ vars.CONTACT_PROVIDER }}
      NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }}
      # YouTube Data API key (repository secret). Without it the site keeps the
      # last recorded stats.
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh channel stats
        if: env.YOUTUBE_API_KEY != ''
        run: node scripts/update-channel-stats.mjs
      - name: Save stats history
        if: env.YOUTUBE_API_KEY != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/channel-stats.json
          if ! git diff --cached --quiet; then
            git commit -m "Update channel stats [skip ci]"
            git pull --rebase
            git push
          fi
      # Switch to `npm run build:strict` to block deploys while placeholders remain.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
